# Gate de estilo dos arquivos alterados.
#
# Typecheck, testes e audit sairam daqui: o ci.yml ja roda os dois primeiros e o
# security.yml cobre vulnerabilidade de dependencia com o osv-scanner. Sobrou o
# prettier, que o lefthook aplica no pre-commit local mas ninguem garante em PR
# de fora.
#
# So arquivos alterados, porque a base herdada do upstream nao esta toda
# formatada e reprovar o repositorio inteiro seria um gate que se desliga.

name: Estilo

on:
  pull_request:
    paths:
      - '.github/workflows/quality-gates.yml'
      - 'lefthook.yml'
      - 'package/ego-browser/**'
      - 'package/ego-linux-host/**'
      - 'skills/ego-browser/learnings/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prettier:
    name: Prettier (arquivos alterados)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0 # a comparacao precisa do commit base
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package/ego-browser/package-lock.json

      - name: Instalar dependencias
        working-directory: package/ego-browser
        run: npm ci

      - name: Conferir estilo dos arquivos alterados
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          files="$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD \
            | grep -E '^package/(ego-browser|ego-linux-host)/.*\.(ts|mjs|js|json|md)$' || true)"
          [ -z "$files" ] && exit 0
          package/ego-browser/node_modules/.bin/prettier --check $files
