# Build, typecheck e testes dos dois pacotes.
#
# Actions de terceiros pinadas por SHA completo — tag e mutavel, e foi o vetor
# dos ataques tj-actions (mar/2025) e trivy-action (mar/2026). O Dependabot
# atualiza os SHAs e o comentario da versao junto.
#
# Sem job de release: os pacotes deste repositorio nao sao publicados. Release
# do ego-browser sai do upstream citrolabs/ego-lite.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ego-browser:
    name: ego-browser (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    defaults:
      run:
        working-directory: package/ego-browser
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package/ego-browser/package-lock.json

      - run: npm ci
      - run: npm test
      - name: Validar site skills
        run: npm run validate:site-skills

  ego-linux-host:
    name: ego-linux-host (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `engines` exige >= 22; Node 20 sairia do suporte antes deste MVP
        # amadurecer, e testar nele dava um verde que nao valia nada.
        node: ['22', '24']
    defaults:
      run:
        working-directory: package/ego-linux-host
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package/ego-linux-host/package-lock.json

      - run: npm ci
      # build + typecheck + node --test. O e2e com Chrome fica de fora: e
      # gated em EGO_LINUX_E2E=1 e precisa de navegador e display.
      - run: npm test

      - name: Conferir os artefatos de build
        # O binario `ego-browser` do host aponta para dist/; um build que gera
        # menos que isto quebraria a instalacao sem quebrar o build.
        run: |
          for alvo in dist/cli.js dist/host-daemon.js dist/ego-runtime.js; do
            if [ ! -e "$alvo" ]; then
              echo "::error::build nao gerou $alvo"
              exit 1
            fi
          done
          echo "artefatos presentes"
